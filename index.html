<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <h3>Tech Fest 2026</h3>

    <p>
        Register for our annual technical event and participate
        in exciting workshops and competitions.
    </p>

    <form>

        <label>Student Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Register Number</label>
        <input type="text" placeholder="Enter register number">

        <label>Department</label>
        <input type="text" placeholder="Enter department">

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Event Date</label>
        <input type="date">

        <button type="submit">Register for Event</button>

    </form>

</div>

</body>
</html>
