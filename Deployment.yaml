apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-event
spec:
  replicas: 3

  selector:
    matchLabels:
      app: student-event

  template:
    metadata:
      labels:
        app: student-event

    spec:
      containers:
        - name: student-event
          image: abhijith006/student-event-registration:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-event-service

spec:
  type: NodePort

  selector:
    app: student-event

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
